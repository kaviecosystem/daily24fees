<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2B25">
<title>Collected fees</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#0F2B25; --felt-deep:#09201B; --felt-raised:#153A32; --line:#2A5247;
  --gold:#D9B66F; --gold-soft:#B8975A; --ivory:#F2EADB; --sage:#9DB5A9;
  --ruby:#D9645A; --ok:#7FC8A1;
  --serif:"Cormorant Garamond",Georgia,serif;
  --sans:"Figtree",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(120% 60% at 50% 0%,#1A453B 0%,var(--felt) 45%,var(--felt-deep) 100%) fixed;
  color:var(--ivory);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));
}
.card{
  width:100%;max-width:340px;text-align:center;
  background:linear-gradient(180deg,var(--felt-raised),var(--felt));
  border:1px solid var(--line);border-radius:16px;padding:16px 14px 14px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}
.label{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--sage)}
.amount{margin:8px 0 12px;font-family:var(--serif);font-weight:700;color:var(--gold);line-height:1;
  display:flex;align-items:baseline;justify-content:center;gap:6px;flex-wrap:wrap;word-break:break-all}
.amount #amt{font-size:clamp(30px,10vw,38px)}
.amount small{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--sage)}
.rows{margin:0 0 12px;border-top:1px solid var(--line)}
.rows div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:12.5px}
.rows dt{color:var(--sage);text-align:left}
.rows dd{color:var(--ivory);font-weight:600;text-align:right;word-break:break-all}
.btn{
  width:100%;padding:11px 14px;border-radius:12px;font-weight:700;font-size:15px;
  color:#1B1405;background:linear-gradient(180deg,#E6C887,var(--gold));
  transition:transform .12s,opacity .2s;
}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.msg{min-height:16px;margin-top:8px;font-size:12.5px;line-height:1.4;color:var(--sage)}
.msg.err{color:var(--ruby)}
.msg.ok{color:var(--ok)}
.msg a{color:var(--gold)}
</style>
</head>
<body>
<main class="card" aria-live="polite">
  <div class="label">Collected fees</div>
  <div class="amount"><span id="amt">…</span><small>USDT</small></div>
  <dl class="rows">
    <div><dt>Total collected so far</dt><dd><span id="tot">…</span> USDT</dd></div>
    <div><dt>Undistributed fund</dt><dd><span id="und">…</span> USDT</dd></div>
  </dl>
  <button class="btn" id="btn" type="button" disabled>Collect fees</button>
  <p class="msg" id="msg" role="status"></p>
</main>

<script>
"use strict";
const CFG = {
  chainId: 56,
  chainHex: "0x38",
  pool: "0xBa3cA0fA5c5dbbC3d97AfcE7126eeDc6b8436A13",
  explorer: "https://bscscan.com",
  rpcs: [
    "https://bsc-dataseed.bnbchain.org",
    "https://bsc-dataseed1.binance.org",
    "https://bsc-rpc.publicnode.com",
    "https://bsc-dataseed1.defibit.io",
    "https://1rpc.io/bnb"
  ]
};
const SEL = { pending: "0x224438d1", withdraw: "0x476343ee",      // pendingFees(), withdrawFees()
              usdt: "0x2f48ab7d", feeWallet: "0xf25f4b56", undist: "0xeb72c8d8" };
const TOPIC_TRANSFER = "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef";
const REVERTS = {
  "0x30cd7471": "This wallet isn’t allowed to collect fees.",       // NotOwner()
  "0xd0d04f60": "There are no fees to collect right now."           // NothingToWithdraw()
};

const $ = id => document.getElementById(id);
let fees = 0n, withdrawn = null, busy = false, totalBusy = false, ctx = null;

function msg(text, cls, html){
  const el = $("msg");
  el.className = "msg" + (cls ? " " + cls : "");
  if (html) el.innerHTML = text; else el.textContent = text;
}

/* ---------- read-only JSON-RPC with fallback ---------- */
async function rpc(method, params){
  let last;
  for (const url of CFG.rpcs){
    try{
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 9000);
      const res = await fetch(url, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }), signal: ctl.signal
      });
      clearTimeout(tm);
      const j = await res.json();
      if (j.error){
        const e = new Error(j.error.message || "RPC error");
        e.data = typeof j.error.data === "string" ? j.error.data : (j.error.data && j.error.data.data) || "";
        e.revert = /revert/i.test(e.message) || /^0x[0-9a-f]{8}/i.test(e.data);
        if (e.revert) throw e;
        last = e; continue;
      }
      return j.result;
    }catch(e){ if (e.revert) throw e; last = e; }
  }
  throw last || new Error("Network unavailable");
}

function fmt(v){
  const s = v.toString().padStart(19, "0");
  const whole = s.slice(0, -18).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  const frac = s.slice(-18, -14).replace(/0+$/, "").padEnd(2, "0");
  return whole + "." + frac;
}

async function loadFees(){
  try{
    const r = await rpc("eth_call", [{ to: CFG.pool, data: SEL.pending }, "latest"]);
    fees = BigInt(r);
    $("amt").textContent = fmt(fees);
    showTotal();
  }catch(e){
    $("amt").textContent = "–";
    if (!busy) msg("Couldn’t load the amount. Check your connection.", "err");
    return;
  }
  if (!busy){
    $("btn").disabled = fees === 0n;
    if ($("msg").classList.contains("err") && /load the amount/.test($("msg").textContent)) msg("");
  }
}


/* ---------- undistributed fund + total collected so far ---------- */
const pad32 = a => "0x" + a.toLowerCase().replace(/^0x/, "").padStart(64, "0");
const addrOf = r => "0x" + r.slice(-40);

async function loadUndist(){
  try{
    const r = await rpc("eth_call", [{ to: CFG.pool, data: SEL.undist }, "latest"]);
    $("und").textContent = fmt(BigInt(r));
  }catch(_){ $("und").textContent = "–"; }
}

function showTotal(){
  $("tot").textContent = withdrawn === null ? "–" : fmt(withdrawn + fees);
}

async function getCtx(){
  if (ctx) return ctx;
  const [u, f] = await Promise.all([
    rpc("eth_call", [{ to: CFG.pool, data: SEL.usdt }, "latest"]),
    rpc("eth_call", [{ to: CFG.pool, data: SEL.feeWallet }, "latest"])
  ]);
  return (ctx = { usdt: addrOf(u), fw: addrOf(f) });
}

async function sumLogs(c, from, to){
  const logs = await rpc("eth_getLogs", [{
    address: c.usdt, topics: [TOPIC_TRANSFER, pad32(CFG.pool), pad32(c.fw)],
    fromBlock: "0x" + from.toString(16), toBlock: "0x" + to.toString(16)
  }]);
  return logs.reduce((t, l) => t + BigInt(l.data), 0n);
}

// Fees already sent to the fee wallet = USDT transfers pool -> fee wallet.
// Scanned once, then only new blocks are read (progress is cached in this browser).
async function loadWithdrawn(){
  if (totalBusy) return;
  totalBusy = true;
  try{
    const c = await getCtx();
    const key = "feesScan:" + CFG.pool.toLowerCase() + ":" + c.fw;
    let st = null; try{ st = JSON.parse(localStorage.getItem(key) || "null"); }catch(_){}
    const head = parseInt(await rpc("eth_blockNumber", []), 16);
    let sum = st ? BigInt(st.sum) : 0n;
    const from = st ? st.to + 1 : 0;
    if (from <= head){
      try{
        sum += await sumLogs(c, from, head);                    // one request when the node allows it
      }catch(_){
        const size = 50000, start = st ? from : Math.max(0, head - 3000000);
        const ranges = [];
        for (let a = start; a <= head; a += size) ranges.push([a, Math.min(a + size - 1, head)]);
        let i = 0, add = 0n;
        await Promise.all(Array.from({ length: 5 }, async () => {
          while (i < ranges.length){ const [a, b] = ranges[i++]; const v = await sumLogs(c, a, b); add += v; }
        }));
        sum += add;
      }
      try{ localStorage.setItem(key, JSON.stringify({ sum: sum.toString(), to: head })); }catch(_){}
    }
    withdrawn = sum;
  }catch(_){ /* leave as is; shows – if never loaded */ }
  finally{ totalBusy = false; showTotal(); }
}

/* ---------- wallet ---------- */
async function ensureChain(eth){
  const cid = await eth.request({ method: "eth_chainId" });
  if (parseInt(cid, 16) === CFG.chainId) return;
  try{
    await eth.request({ method: "wallet_switchEthereumChain", params: [{ chainId: CFG.chainHex }] });
  }catch(e){
    if (e && (e.code === 4902 || /unrecognized|not added/i.test(e.message || ""))){
      await eth.request({ method: "wallet_addEthereumChain", params: [{
        chainId: CFG.chainHex, chainName: "BNB Smart Chain",
        nativeCurrency: { name: "BNB", symbol: "BNB", decimals: 18 },
        rpcUrls: [CFG.rpcs[0]], blockExplorerUrls: [CFG.explorer]
      }]});
    } else throw e;
  }
}

function friendly(e){
  const data = ((e && e.data && (typeof e.data === "string" ? e.data : e.data.data)) || "").slice(0, 10).toLowerCase();
  if (REVERTS[data]) return REVERTS[data];
  const m = (e && (e.message || "")) + "";
  if (e && (e.code === 4001 || e.code === "ACTION_REJECTED" || /user (rejected|denied)|rejected the request/i.test(m))) return "You cancelled the request in your wallet.";
  if (/insufficient funds|gas required exceeds/i.test(m)) return "Not enough BNB for the network fee.";
  if (/revert/i.test(m)) return "The network rejected this transaction. Please try again.";
  return "Something went wrong. Please try again.";
}

async function waitReceipt(hash){
  for (let i = 0; i < 100; i++){
    await new Promise(r => setTimeout(r, 3000));
    try{
      const rc = await rpc("eth_getTransactionReceipt", [hash]);
      if (rc) return rc;
    }catch(_){}
  }
  return null;
}

async function collect(){
  if (busy) return;
  const eth = window.ethereum;
  if (!eth){ msg("Open this page inside a wallet app such as MetaMask or Trust Wallet.", "err"); return; }
  busy = true; $("btn").disabled = true;
  try{
    msg("Connecting your wallet…");
    const accounts = await eth.request({ method: "eth_requestAccounts" });
    const from = accounts && accounts[0];
    if (!from) throw new Error("No account");
    await ensureChain(eth);

    // dry run: catches “not allowed” / “nothing to collect” before asking for a signature
    msg("Checking…");
    await rpc("eth_call", [{ from, to: CFG.pool, data: SEL.withdraw }, "latest"]);

    msg("Confirm in your wallet.");
    const hash = await eth.request({ method: "eth_sendTransaction", params: [{ from, to: CFG.pool, data: SEL.withdraw }] });

    msg("Sent. Waiting for the network to confirm…");
    const rc = await waitReceipt(hash);
    const link = `<a href="${CFG.explorer}/tx/${hash}" target="_blank" rel="noopener">View transaction</a>`;
    if (rc && rc.status === "0x1") msg("Fees collected. " + link, "ok", true);
    else if (rc) msg("The transaction failed. " + link, "err", true);
    else msg("Still waiting for confirmation. " + link, "", true);
  }catch(e){
    msg(friendly(e), "err");
  }finally{
    busy = false;
    await loadFees(); loadUndist(); loadWithdrawn();
  }
}

$("btn").addEventListener("click", collect);
function refreshAll(){ loadFees(); loadUndist(); loadWithdrawn(); }
refreshAll();
setInterval(refreshAll, 20000);
</script>
</body>
</html>
